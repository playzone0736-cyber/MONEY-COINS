<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MONEY COINS</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#10172d,#263d65);
  color: white;
  text-align: center;
}
h1 { color: gold; font-size: 38px; }
.panel {
  background: #ffffff18;
  margin: 15px auto;
  padding: 20px;
  border-radius: 18px;
  max-width: 420px;
}
.money { font-size: 30px; color: gold; }
button {
  background: gold;
  border: none;
  border-radius: 12px;
  padding: 14px 20px;
  margin: 7px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}
button:hover { background: orange; }
.coin { font-size: 85px; cursor: pointer; }
</style>
</head>
<body>

<h1>🪙 MONEY COINS</h1>
<p>Cel mai tare joc cu monede!</p>

<div class="panel">
  <p>Banii tăi:</p>
  <div class="money" id="money">0 🪙</div>
  <p>Monede pe apăsare: <span id="power">1</span></p>
  <div class="coin" onclick="collect()">🪙</div>
  <button onclick="collect()">COLECTEAZĂ!</button>
</div>

<div class="panel">
  <h2>🏪 MAGAZIN</h2>
  <p>Upgrade 1: +1 monedă</p>
  <p>Preț: <span id="price">20</span> monede</p>
  <button onclick="upgrade()">CUMPĂRĂ</button>
  <p id="message">Succes la colecționat!</p>
</div>

<button onclick="resetGame()">RESETEAZĂ JOCUL</button>

<script>
let money = Number(localStorage.getItem("money")) || 0;
let power = Number(localStorage.getItem("power")) || 1;
let price = Number(localStorage.getItem("price")) || 20;

function update() {
  document.getElementById("money").textContent = money + " 🪙";
  document.getElementById("power").textContent = power;
  document.getElementById("price").textContent = price;
  localStorage.setItem("money", money);
  localStorage.setItem("power", power);
  localStorage.setItem("price", price);
}

function collect() {
  money += power;
  update();
}

function upgrade() {
  if (money >= price) {
    money -= price;
    power++;
    price = Math.floor(price * 1.7);
    document.getElementById("message").textContent = "Upgrade cumpărat!";
  } else {
    document.getElementById("message").textContent = "Nu ai destule monede!";
  }
  update();
}

function resetGame() {
  money = 0;
  power = 1;
  price = 20;
  update();
}

update();
</script>

</body>
</html>
